name: winget-check

on:
  workflow_dispatch:
  push:
    branches: [codex/winget-validation]
    paths: [installer/winget/**, .github/workflows/winget-check.yml]

permissions:
  contents: read

jobs:
  installed-package:
    # This check needs public installers only. Never consume private-repository minutes.
    if: github.event.repository.private == false
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install official current WinGet bundle on disposable runner
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $ProgressPreference = 'SilentlyContinue'
          $base = 'https://github.com/microsoft/winget-cli/releases/download/v1.29.290'
          $bundle = Join-Path $env:RUNNER_TEMP 'AppInstaller.msixbundle'
          $depsZip = Join-Path $env:RUNNER_TEMP 'AppInstaller-deps.zip'
          $depsDir = Join-Path $env:RUNNER_TEMP 'AppInstaller-deps'
          Invoke-WebRequest "$base/Microsoft.DesktopAppInstaller_8wekyb3d8bbwe.msixbundle" -OutFile $bundle
          Invoke-WebRequest "$base/DesktopAppInstaller_Dependencies.zip" -OutFile $depsZip
          Expand-Archive $depsZip $depsDir
          $deps = @(Get-ChildItem $depsDir -Recurse -File | Where-Object { $_.FullName -match '\\x64\\' -and $_.Extension -in @('.appx','.msix') } | Select-Object -ExpandProperty FullName)
          if ($deps.Count -eq 0) { throw 'No x64 App Installer dependencies found' }
          Add-AppxPackage -Path $bundle -DependencyPath $deps
      - name: Validate, install and uninstall published package
        shell: pwsh
        run: ./installer/winget/check.ps1
      - name: Summarize reports without artifact storage
        if: always()
        shell: pwsh
        run: |
          if (Test-Path dist/winget-check/result.json) { Get-Content dist/winget-check/result.json | Tee-Object -FilePath $env:GITHUB_STEP_SUMMARY -Append }
          if (Test-Path dist/winget-check/runtime-checks.json) { Get-Content dist/winget-check/runtime-checks.json }
